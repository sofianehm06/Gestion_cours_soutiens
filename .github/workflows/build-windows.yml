name: Construire l'application Windows

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Construire l'installateur et la version portable
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # Deux artefacts séparés : on ne télécharge que celui dont on a besoin.
      - uses: actions/upload-artifact@v4
        with:
          name: GestionSoutien-portable
          path: release/GestionSoutien-Portable-*.exe
          compression-level: 0 # l'exe est déjà compressé
      - uses: actions/upload-artifact@v4
        with:
          name: GestionSoutien-installation
          path: release/GestionSoutien-Installation-*.exe
          compression-level: 0
